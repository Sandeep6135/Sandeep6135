<svg xmlns="http://www.w3.org/2000/svg" width="500" height="60">
  <!-- Snake body segments wiggling -->
  <circle cx="135" cy="28" r="3.5" fill="#00FF87">
    <animate attributeName="cy" values="28;23;28;33;28" dur="0.8s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="145" cy="28" r="4" fill="#00FF87">
    <animate attributeName="cy" values="28;23;28;33;28" dur="0.8s" repeatCount="indefinite" begin="0.08s"/>
  </circle>
  <circle cx="155" cy="28" r="4.5" fill="#00FF87">
    <animate attributeName="cy" values="28;23;28;33;28" dur="0.8s" repeatCount="indefinite" begin="0.16s"/>
  </circle>
  <circle cx="166" cy="28" r="5" fill="#00F7FF">
    <animate attributeName="cy" values="28;23;28;33;28" dur="0.8s" repeatCount="indefinite" begin="0.24s"/>
  </circle>
  <!-- Snake head -->
  <circle cx="178" cy="28" r="6" fill="#00F7FF">
    <animate attributeName="cy" values="28;23;28;33;28" dur="0.8s" repeatCount="indefinite" begin="0.32s"/>
  </circle>
  <!-- Snake eye -->
  <circle cx="181" cy="26" r="1.5" fill="white">
    <animate attributeName="cy" values="26;21;26;31;26" dur="0.8s" repeatCount="indefinite" begin="0.32s"/>
  </circle>
  <!-- Snake tongue -->
  <line x1="184" y1="28" x2="190" y2="26" stroke="#FF007F" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="y1" values="28;23;28;33;28" dur="0.8s" repeatCount="indefinite" begin="0.32s"/>
    <animate attributeName="y2" values="26;21;26;31;26" dur="0.8s" repeatCount="indefinite" begin="0.32s"/>
    <animate attributeName="x2" values="190;192;190" dur="0.3s" repeatCount="indefinite"/>
  </line>
  <!-- Title text -->
  <text x="300" y="28" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#00FF87">
    CONTRIBUTION SNAKE
    <animate attributeName="fill" values="#00FF87;#00F7FF;#00FF87" dur="4s" repeatCount="indefinite"/>
  </text>
  <!-- Nom nom dots being eaten -->
  <circle cx="405" cy="50" r="3" fill="#BD93F9">
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="415" cy="50" r="3" fill="#FF007F">
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle cx="425" cy="50" r="3" fill="#00F7FF">
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
</svg>
