<svg width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700&amp;display=swap');
    .morph-text { font-family: 'Roboto', sans-serif; font-size: 32px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .t1 { fill: #4285F4; animation: fade1 9s infinite; }
    .t2 { fill: #EA4335; animation: fade2 9s infinite; }
    .t3 { fill: #FBBC05; animation: fade3 9s infinite; }
    @keyframes fade1 { 0%, 25% { opacity: 1; transform: scale(1); filter: blur(0px); } 33%, 100% { opacity: 0; transform: scale(1.2); filter: blur(4px); } }
    @keyframes fade2 { 0%, 25% { opacity: 0; transform: scale(0.8); filter: blur(4px); } 33%, 58% { opacity: 1; transform: scale(1); filter: blur(0px); } 66%, 100% { opacity: 0; transform: scale(1.2); filter: blur(4px); } }
    @keyframes fade3 { 0%, 58% { opacity: 0; transform: scale(0.8); filter: blur(4px); } 66%, 92% { opacity: 1; transform: scale(1); filter: blur(0px); } 100% { opacity: 0; transform: scale(1.2); filter: blur(4px); } }
  </style>
  <text x="50%" y="50%" class="morph-text t1">"Where Binary Meets Beats."</text>
  <text x="50%" y="50%" class="morph-text t2">"Code Meets Composition."</text>
  <text x="50%" y="50%" class="morph-text t3">"Chaos Meets Craft."</text>
</svg>
