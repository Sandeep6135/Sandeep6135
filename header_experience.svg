<svg xmlns="http://www.w3.org/2000/svg" width="500" height="60">
  <text x="250" y="25" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#4285F4">
    💼 EXPERIENCE &amp; JOURNEY
    <animate attributeName="fill" values="#4285F4;#EA4335;#FBBC05;#34A853;#4285F4" dur="8s" repeatCount="indefinite"/>
  </text>
  <!-- Animated progress bar -->
  <rect x="100" y="42" width="300" height="3" rx="1.5" fill="#E8EAED" opacity="0.3"/>
  <rect x="100" y="42" width="300" height="3" rx="1.5" fill="#4285F4">
    <animate attributeName="width" values="0;300" dur="2s" fill="freeze"/>
    <animate attributeName="fill" values="#4285F4;#34A853" dur="2s" fill="freeze"/>
  </rect>
  <!-- Completion dot -->
  <circle cx="400" cy="43.5" r="4" fill="#34A853">
    <animate attributeName="opacity" values="0;0;1" dur="2.2s" fill="freeze"/>
    <animate attributeName="r" values="0;6;4" dur="0.5s" fill="freeze" begin="2s"/>
  </circle>
  <!-- Check mark text -->
  <text x="400" y="44" text-anchor="middle" dominant-baseline="middle"
        font-family="sans-serif" font-size="6" font-weight="900" fill="white">
    ✓
    <animate attributeName="opacity" values="0;0;1" dur="2.5s" fill="freeze"/>
  </text>
</svg>
