<svg width="500" height="80" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@900&amp;display=swap');
    .cut { font-family: 'Roboto', sans-serif; font-size: 32px; font-weight: 900; fill: #4285F4; text-anchor: middle; dominant-baseline: middle; }
    .top { clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); animation: slideTop 3s infinite alternate; }
    .bottom { clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%); animation: slideBottom 3s infinite alternate; fill: #EA4335; }
    @keyframes slideTop { 0%, 20% { transform: translateX(0); } 40%, 100% { transform: translateX(-5px); } }
    @keyframes slideBottom { 0%, 20% { transform: translateX(0); } 40%, 100% { transform: translateX(5px); } }
  </style>
  <text x="50%" y="50%" class="cut top">💼 EXPERIENCE &amp; JOURNEY</text>
  <text x="50%" y="50%" class="cut bottom">💼 EXPERIENCE &amp; JOURNEY</text>
</svg>
