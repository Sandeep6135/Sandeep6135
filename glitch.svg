<svg width="800" height="150" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@900&amp;display=swap');
    .text { font-family: 'Roboto', sans-serif; font-size: 65px; font-weight: 900; fill: #4285F4; text-anchor: middle; dominant-baseline: middle; }
    .glitch2 { fill: #EA4335; animation: glitch2 3s infinite; opacity: 0.8; }
    .glitch3 { fill: #FBBC05; animation: glitch3 3s infinite; opacity: 0.8; }
    @keyframes glitch2 {
      0% { transform: translate(0); clip-path: inset(0 0 0 0); }
      10% { transform: translate(-4px, 2px); clip-path: inset(10% 0 80% 0); }
      20% { transform: translate(4px, -2px); clip-path: inset(80% 0 10% 0); }
      30% { transform: translate(0); clip-path: inset(0 0 0 0); }
      100% { transform: translate(0); clip-path: inset(0 0 0 0); }
    }
    @keyframes glitch3 {
      0% { transform: translate(0); clip-path: inset(0 0 0 0); }
      15% { transform: translate(4px, -2px); clip-path: inset(50% 0 30% 0); }
      25% { transform: translate(-4px, 2px); clip-path: inset(20% 0 60% 0); }
      35% { transform: translate(0); clip-path: inset(0 0 0 0); }
      100% { transform: translate(0); clip-path: inset(0 0 0 0); }
    }
  </style>
  <text x="50%" y="45%" class="text glitch3">SANDEEP KARMATA</text>
  <text x="50%" y="45%" class="text glitch2">SANDEEP KARMATA</text>
  <text x="50%" y="45%" class="text">SANDEEP KARMATA</text>
  <text x="50%" y="85%" font-family="Roboto" font-size="22" fill="#34A853" font-weight="bold" text-anchor="middle">
    GOOGLE DEVELOPER | CYBERSECURITY ENGINEER
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
  </text>
</svg>
