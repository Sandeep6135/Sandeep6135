<svg width="500" height="80" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@900&amp;display=swap');
    .zoom { font-family: 'Roboto', sans-serif; font-size: 32px; font-weight: 900; fill: #34A853; text-anchor: middle; dominant-baseline: middle; animation: zoom 2s infinite; transform-origin: center; }
    @keyframes zoom {
      0% { transform: scale(1); opacity: 1; fill: #34A853; }
      50% { transform: scale(1.08); opacity: 0.8; fill: #4285F4; }
      100% { transform: scale(1); opacity: 1; fill: #34A853; }
    }
  </style>
  <text x="50%" y="50%" class="zoom">🛠️ CURRENTLY BUILDING</text>
</svg>
