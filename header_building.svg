<svg xmlns="http://www.w3.org/2000/svg" width="500" height="60">
  <defs>
    <linearGradient id="build-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>
  <text x="250" y="28" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#34A853">
    🛠️ CURRENTLY BUILDING
    <animateTransform attributeName="transform" type="scale" values="1;1.04;1" dur="3s" repeatCount="indefinite" additive="sum"/>
  </text>
  <!-- Pulsing ring behind text -->
  <rect x="60" y="5" width="380" height="42" rx="21" fill="none" stroke="#34A853" stroke-width="1.5">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;2.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Bottom accent dots -->
  <circle cx="220" cy="55" r="2" fill="#34A853">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="240" cy="55" r="2" fill="#4285F4">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="260" cy="55" r="2" fill="#FBBC05">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="280" cy="55" r="2" fill="#EA4335">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
</svg>
