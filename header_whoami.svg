<svg xmlns="http://www.w3.org/2000/svg" width="500" height="60">
  <defs>
    <linearGradient id="wh-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>
  <!-- Blinking cursor -->
  <rect x="22" y="12" width="3" height="26" fill="#34A853">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Terminal prompt text -->
  <text x="35" y="30" font-family="'Cascadia Code', 'Fira Code', 'Consolas', monospace"
        font-size="22" font-weight="700" fill="#4285F4" letter-spacing="1">
    ➤ SYSTEM_INIT: WHOAMI
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </text>
  <!-- Animated underline -->
  <line x1="35" y1="45" x2="310" y2="45" stroke="url(#wh-line)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x2" values="35;310" dur="1.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.8" dur="1.5s" fill="freeze"/>
  </line>
</svg>
