<svg xmlns="http://www.w3.org/2000/svg" width="500" height="60">
  <defs>
    <filter id="arsenal-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="250" y="28" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#EA4335"
        filter="url(#arsenal-glow)">
    ⚡ CYBER ARSENAL
  </text>
  <!-- Lightning bolt accents -->
  <line x1="90" y1="28" x2="120" y2="28" stroke="#EA4335" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="x2" values="90;120" dur="0.3s" repeatCount="indefinite" begin="0s"/>
  </line>
  <line x1="380" y1="28" x2="410" y2="28" stroke="#EA4335" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="x1" values="410;380" dur="0.3s" repeatCount="indefinite" begin="1s"/>
  </line>
  <!-- Bottom spark dots -->
  <circle cx="200" cy="50" r="1.5" fill="#FBBC05">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="230" cy="52" r="1" fill="#EA4335">
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="260" cy="49" r="1.5" fill="#4285F4">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle cx="290" cy="51" r="1" fill="#34A853">
    <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="310" cy="50" r="1.5" fill="#FBBC05">
    <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite" begin="0.7s"/>
  </circle>
</svg>
