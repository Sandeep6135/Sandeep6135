<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140">
  <defs>
    <!-- Glowing filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Shifting linear gradient for name -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF">
        <animate attributeName="stop-color" values="#00F7FF;#BD93F9;#FF007F;#00F7FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF007F">
        <animate attributeName="stop-color" values="#FF007F;#00F7FF;#BD93F9;#FF007F" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shifting gradient for border/line -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#BD93F9"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="140" rx="10" fill="#050508"/>
  <!-- Subtly animated decorative grid or particles -->
  <g opacity="0.15">
    <line x1="0" y1="20" x2="800" y2="20" stroke="#8B949E" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#8B949E" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="800" y2="60" stroke="#8B949E" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#8B949E" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#8B949E" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#8B949E" stroke-width="0.5"/>
  </g>

  <!-- Name text with gradient and glow -->
  <text x="400" y="55" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Roboto, sans-serif"
        font-size="48" font-weight="900" fill="url(#cyber-grad)" filter="url(#neon-glow)" letter-spacing="4">
    SANDEEP KARMATA
    <animate attributeName="letter-spacing" values="4;6;4" dur="4s" repeatCount="indefinite" />
  </text>
  
  <!-- Glowing Divider Line -->
  <line x1="200" y1="88" x2="600" y2="88" stroke="url(#line-grad)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-width" values="1.5;3;1.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x1" values="200;180;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="600;620;600" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Subtitle -->
  <text x="400" y="115" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Roboto, sans-serif"
        font-size="12" font-weight="800" fill="#E2E8F0" letter-spacing="5">
    CYBERSECURITY ENGINEER  ·  CREATIVE TECHNOLOGIST
  </text>
</svg>
