<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120">
  <style>
    @keyframes borderPulse {
      0%, 100% { stroke: #4C566A; }
      50% { stroke: #88C0D0; opacity: 0.8; }
    }
    @keyframes textGlow {
      0%, 100% { fill: #ECEFF4; text-shadow: 0 0 0px rgba(136, 192, 208, 0); }
      50% { fill: #ECEFF4; text-shadow: 0 0 8px rgba(136, 192, 208, 0.6); }
    }
    @keyframes lineSweep {
      0%, 100% { x1: 320; x2: 480; stroke: #88C0D0; }
      50% { x1: 260; x2: 540; stroke: #81A1C1; }
    }
    .border { animation: borderPulse 8s infinite ease-in-out; }
    .title { animation: textGlow 10s infinite ease-in-out; }
    .divider { animation: lineSweep 6s infinite ease-in-out; }
  </style>

  <!-- Solid Nord Dark Background -->
  <rect width="800" height="120" rx="6" fill="#2E3440"/>
  
  <!-- Outer clean border -->
  <rect class="border" x="10" y="10" width="780" height="100" rx="4" fill="none" stroke="#4C566A" stroke-width="1"/>
  
  <!-- Name -->
  <text class="title" x="400" y="52" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="700" fill="#ECEFF4" letter-spacing="4">
    SANDEEP KARMATA
  </text>
  
  <!-- Icy divider line -->
  <line class="divider" x1="320" y1="72" x2="480" y2="72" stroke="#88C0D0" stroke-width="1.5"/>
  
  <!-- Rotating Subtitles (Slide Up Fade Effect) -->
  <text x="400" y="102" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" fill="#81A1C1" letter-spacing="3" opacity="0">
    CYBERSECURITY ENGINEER
    <animate attributeName="opacity" values="0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.05;0.22;0.25;1"/>
    <animate attributeName="y" values="102;92;92;82;82" dur="12s" repeatCount="indefinite" keyTimes="0;0.05;0.22;0.25;1"/>
  </text>

  <text x="400" y="102" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" fill="#88C0D0" letter-spacing="3" opacity="0">
    DEVSECOPS SPECIALIST
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.30;0.47;0.50;1"/>
    <animate attributeName="y" values="102;102;92;92;82;82" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.30;0.47;0.50;1"/>
  </text>

  <text x="400" y="102" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" fill="#8FBCBB" letter-spacing="3" opacity="0">
    OPEN SOURCE CONTRIBUTOR
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.50;0.55;0.72;0.75;1"/>
    <animate attributeName="y" values="102;102;92;92;82;82" dur="12s" repeatCount="indefinite" keyTimes="0;0.50;0.55;0.72;0.75;1"/>
  </text>

  <text x="400" y="102" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" fill="#81A1C1" letter-spacing="3" opacity="0">
    CREATIVE TECHNOLOGIST
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;0.80;0.97;0.99;1"/>
    <animate attributeName="y" values="102;102;92;92;82;82" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;0.80;0.97;0.99;1"/>
  </text>
</svg>
