<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120">
  <!-- Solid Nord Dark Background -->
  <rect width="800" height="120" rx="6" fill="#2E3440"/>
  
  <!-- Outer clean border -->
  <rect x="10" y="10" width="780" height="100" rx="4" fill="none" stroke="#4C566A" stroke-width="1"/>
  
  <!-- Name -->
  <text x="400" y="52" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="700" fill="#ECEFF4" letter-spacing="4">
    SANDEEP KARMATA
  </text>
  
  <!-- Icy divider line -->
  <line x1="320" y1="72" x2="480" y2="72" stroke="#88C0D0" stroke-width="1.5"/>
  
  <!-- Subtitle -->
  <text x="400" y="92" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" fill="#81A1C1" letter-spacing="3">
    CYBERSECURITY ENGINEER  ·  DEVSECOPS SPECIALIST
  </text>
</svg>
