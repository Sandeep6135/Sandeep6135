<svg xmlns="http://www.w3.org/2000/svg" width="500" height="55">
  <defs>
    <linearGradient id="eq-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34A853"/>
      <stop offset="100%" stop-color="#4285F4"/>
    </linearGradient>
  </defs>
  <!-- Equalizer bars - left side -->
  <rect x="130" y="15" width="5" height="25" rx="2.5" fill="url(#eq-grad)">
    <animate attributeName="height" values="8;22;14;25;8" dur="1.2s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="y" values="22;8;16;5;22" dur="1.2s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <rect x="138" y="10" width="5" height="30" rx="2.5" fill="url(#eq-grad)">
    <animate attributeName="height" values="15;28;10;20;15" dur="1s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="y" values="15;2;20;10;15" dur="1s" repeatCount="indefinite" begin="0.15s"/>
  </rect>
  <rect x="146" y="12" width="5" height="28" rx="2.5" fill="url(#eq-grad)">
    <animate attributeName="height" values="12;25;18;8;12" dur="1.4s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="y" values="18;5;12;22;18" dur="1.4s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <rect x="154" y="8" width="5" height="32" rx="2.5" fill="url(#eq-grad)">
    <animate attributeName="height" values="20;10;28;15;20" dur="0.9s" repeatCount="indefinite" begin="0.1s"/>
    <animate attributeName="y" values="10;20;2;15;10" dur="0.9s" repeatCount="indefinite" begin="0.1s"/>
  </rect>
  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FBBC05">
    🎧 NOW PLAYING
    <animate attributeName="fill" values="#FBBC05;#EA4335;#FBBC05" dur="3s" repeatCount="indefinite"/>
  </text>
  <!-- Equalizer bars - right side -->
  <rect x="341" y="12" width="5" height="28" rx="2.5" fill="url(#eq-grad)">
    <animate attributeName="height" values="18;8;25;12;18" dur="1.1s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="y" values="12;22;5;18;12" dur="1.1s" repeatCount="indefinite" begin="0.2s"/>
  </rect>
  <rect x="349" y="10" width="5" height="30" rx="2.5" fill="url(#eq-grad)">
    <animate attributeName="height" values="10;28;15;22;10" dur="1.3s" repeatCount="indefinite" begin="0.05s"/>
    <animate attributeName="y" values="20;2;15;8;20" dur="1.3s" repeatCount="indefinite" begin="0.05s"/>
  </rect>
  <rect x="357" y="15" width="5" height="25" rx="2.5" fill="url(#eq-grad)">
    <animate attributeName="height" values="25;12;8;20;25" dur="0.95s" repeatCount="indefinite" begin="0.25s"/>
    <animate attributeName="y" values="5;18;22;10;5" dur="0.95s" repeatCount="indefinite" begin="0.25s"/>
  </rect>
  <rect x="365" y="8" width="5" height="32" rx="2.5" fill="url(#eq-grad)">
    <animate attributeName="height" values="14;22;28;10;14" dur="1.15s" repeatCount="indefinite" begin="0.35s"/>
    <animate attributeName="y" values="16;8;2;20;16" dur="1.15s" repeatCount="indefinite" begin="0.35s"/>
  </rect>
  <!-- Subtitle -->
  <text x="250" y="47" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8B949E">
    Sanzaar · Independent Artist · Multi-Instrumentalist
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
